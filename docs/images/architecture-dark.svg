  </g>
  
  <g>
    <rect x="48" y="392" width="248" height="84" rx="14" fill="#1c2128" stroke="#30363d" filter="url(#shadow)"/>
    <rect x="64" y="414" width="40" height="40" rx="11" fill="#14b8a6" fill-opacity="0.2"/>
    <g transform="translate(74 424)" fill="none" stroke="#14b8a6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h7l4 4v11.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5z"/><path d="M12 2v4h4M7.5 11h5M7.5 14h5"/></g>
    <text x="120" y="425" class="title">Backups and exports</text><text x="120" y="444" class="sub">Encrypted backups,</text><text x="120" y="460" class="sub">CSV and JSON exports</text>
  </g>
  
  <g>
    <rect x="416" y="392" width="248" height="84" rx="14" fill="#1c2128" stroke="#30363d" filter="url(#shadow)"/>
    <rect x="432" y="414" width="40" height="40" rx="11" fill="#f59e0b" fill-opacity="0.2"/>
    <g transform="translate(442 424)" fill="none" stroke="#f59e0b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="10" cy="4.5" rx="7" ry="2.5"/><path d="M3 4.5v11c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-11M3 10c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/></g>
    <text x="488" y="425" class="title">SQLite database</text><text x="488" y="444" class="sub">Encrypted with SQLCipher</text><text x="488" y="460" class="sub">(AES-256)</text>
