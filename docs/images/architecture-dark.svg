<svg xmlns="http://www.w3.org/2000/svg" width="968" height="540" viewBox="0 0 968 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Personal Finance architecture</title>
  <defs>
