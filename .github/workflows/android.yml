# Builds the Android phone viewer (mobile/) into an APK.
#
# - On a push that changes mobile/: builds it and keeps the APK as a workflow artifact.
# - Called by the Release workflow: also attaches the APK to that version's draft release.
#
# Optional secrets, for an APK signed with the same key every time (needed for a new version to
# install over the old one):
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias
#   ANDROID_KEY_PASSWORD       the key's password
# Without them the APK is signed with a throwaway debug key (see mobile/README.md).
name: Android

on:
  push:
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Attach the APK to this draft release (v0.9.2, say).
        type: string
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck -w mobile
      - run: npm test -w mobile
      # Builds the web part and copies it into the Android project.
      - run: npm run sync -w mobile
      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "file=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key."
          fi
      - name: Build the APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Name the APK
        id: apk
        run: |
          version=$(node -p "require('./mobile/package.json').version")
          name="Finance_Viewer_${version}.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
      - name: Attach to the draft release
        if: ${{ inputs.release-tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.release-tag }}" "${{ steps.apk.outputs.name }}" --clobber
