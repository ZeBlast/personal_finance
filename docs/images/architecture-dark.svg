      .pill { font-size: 11px; font-weight: 500; fill: #adbac7; }
      .heading { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; fill: #8b949e; }
    </style>
  </defs>
  <rect width="968" height="540" fill="#0d1117"/>

