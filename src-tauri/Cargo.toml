[package]
name = "personal-finance"
version = "0.3.1"
description = "Local personal finance app"
authors = []
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name (needed on Windows).
name = "personal_finance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2.4.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "~2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
