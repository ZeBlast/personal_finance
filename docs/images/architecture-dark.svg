  <g><rect x="290" y="190" width="48" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="314" y="204" class="pill" text-anchor="middle">opens</text></g>
  <g><rect x="491.6" y="190" width="188.8" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="586" y="204" class="pill" text-anchor="middle">starts it, with key + token</text></g>
