# Checks every push and pull request: types, lint, and the backend and frontend tests.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    # Windows, like the app: the encrypted SQLite module ships prebuilt for it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
